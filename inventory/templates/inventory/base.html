
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StockFlow{% endblock %}</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1f2937;
            min-height: 100vh;
        }

        header {
            background: #1e40af;
            color: white;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 { font-size: 27px; }

        nav { display: flex; gap: 10px; flex-wrap: wrap; }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 6px;
        }

        nav a:hover { background: #3b82f6; }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .form-card, .section, .card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.07);
            margin-bottom: 24px;
        }

        .form-card {
            max-width: 550px;
            margin: 40px auto;
        }

        h2 { margin-bottom: 18px; color: #1e40af; }
        p { line-height: 1.6; }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        input[type="checkbox"] { width: auto; }

        button, .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 12px 18px;
            margin-top: 18px;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        button:hover, .btn:hover { background: #1d4ed8; }

        .danger { background: #dc2626; }
        .danger:hover { background: #b91c1c; }

        .links { margin-top: 20px; }
        a { color: #2563eb; }
        nav a { color: white; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .table-wrapper { overflow-x: auto; }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th { background: #eff6ff; color: #1e40af; }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
            margin-top: 10px;
        }

        .message {
            padding: 12px;
            margin: 10px 0;
            border-radius: 7px;
            background: #dbeafe;
            color: #1e40af;
        }

        .low { color: #b91c1c; font-weight: bold; }
        .available { color: #15803d; font-weight: bold; }

        footer {
            text-align: center;
            padding: 22px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            header { align-items: flex-start; }
            .form-card, .section, .card { padding: 20px; }
            .container { width: 94%; }
        }
    </style>
</head>

<body>
    <header>
        <h1>StockFlow</h1>

        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <a href="{% url 'product_list' %}">Products</a>
                <a href="{% url 'product_create' %}">Add Product</a>
                <a href="{% url 'settings' %}">Settings</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Signup</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer>StockFlow Inventory Management System</footer>
</body>
</html>
